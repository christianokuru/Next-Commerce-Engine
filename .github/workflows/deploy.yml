# Deploy the engine to Cloudflare Workers (Actions tab → Deploy → Run workflow).
# Repo secrets: CLOUDFLARE_API_TOKEN (required), DATABASE_URL (optional: runs migrations first).
# Worker runtime secrets (DATABASE_URL, BETTER_AUTH_SECRET, SETUP_TOKEN, payment keys) live in Cloudflare.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Wrangler config (e.g. wrangler.jsonc, wrangler.staging.jsonc)"
        required: true
        default: wrangler.staging.jsonc

concurrency:
  group: deploy-${{ github.ref }}-${{ inputs.config }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONFIG: ${{ inputs.config }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check inputs
        run: |
          [[ "$CONFIG" =~ ^wrangler(\.[a-z0-9-]+)?\.jsonc$ && -f "$CONFIG" ]] || { echo "::error::Unknown config: $CONFIG"; exit 1; }
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrate database
        if: env.DATABASE_URL != ''
        run: npm run db:migrate
      - name: Build
        run: npx opennextjs-cloudflare build
      - name: Deploy
        run: npx opennextjs-cloudflare deploy -c "$CONFIG"
